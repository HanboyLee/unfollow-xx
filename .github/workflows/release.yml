name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Node/npm version
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm install --verbose

      - name: Build extension
        run: |
          npm run build 2>&1 || true
          echo "BUILD_EXIT_CODE=$?" >> $GITHUB_ENV
        continue-on-error: true

      - name: Check build result
        if: env.BUILD_EXIT_CODE != '0'
        run: |
          echo "## Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "Build exited with code: $BUILD_EXIT_CODE" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Create release package
        run: |
          cd dist
          zip -r ../x-unfollower-${{ github.ref_name }}.zip .
          cd ..

      - name: Generate release notes
        id: release_notes
        run: |
          echo "## changelog" > release_notes.md
          echo "" >> release_notes.md
          echo "### Version ${{ github.ref_name }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "Download the extension zip file and install it in Chrome:" >> release_notes.md
          echo "" >> release_notes.md
          echo "1. Download \`x-unfollower-${{ github.ref_name }}.zip\`" >> release_notes.md
          echo "2. Go to \`chrome://extensions/\`" >> release_notes.md
          echo "3. Enable \"Developer mode\"" >> release_notes.md
          echo "4. Click \"Load unpacked\" and select the extracted folder" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: x-unfollower-${{ github.ref_name }}.zip
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
